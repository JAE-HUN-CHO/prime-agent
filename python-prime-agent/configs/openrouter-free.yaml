# Example OpenRouter profile. Free model slugs and quotas change; this file is not a guarantee.
# LiteLLM id `openrouter/openrouter/free` is OpenRouter's free router (`openrouter/free`).
# Do not use `openrouter/openrouter/auto` here: that router can select paid models.
# Set OPENROUTER_API_KEY in the environment. Never commit keys.

default_provider: openrouter

providers:
  openrouter:
    type: litellm
    model: openrouter/openrouter/free
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 60
    max_retries: 2

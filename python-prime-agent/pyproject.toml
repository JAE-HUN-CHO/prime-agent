[project]
name = "prime-agent-py"
version = "0.1.0"
description = "Phase 1 Python port of Prime Agent core (LiteLLM providers + agent loop + CLI)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Prime Intellect" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "litellm>=1.50",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
kernel = ["jupyter_client>=8.6", "ipykernel>=6.29"]
mcp = ["mcp>=1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
persistence = ["aiosqlite>=0.20"]

[project.scripts]
prime-agent-py = "prime_agent_py.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_agent_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["prime_agent_py"]
mypy_path = "src"
